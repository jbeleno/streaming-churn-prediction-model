[project]
name = "streaming-churn-prediction"
version = "2.0.0"
description = "Binary classifier for streaming subscription churn (Random Forest, XGBoost, Logistic Regression)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
